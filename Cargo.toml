[workspace]
members = ["crates/belumi-core", "crates/belumi-protocol-compat", "crates/belumi-launcher", "crates/belumi-plugin-api", "crates/belumi-server", "crates/belumi-plugin-sdk", "examples/hello-plugin"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"
version = "0.1.0"

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
needless_range_loop = "allow"
large_enum_variant = "allow"

[workspace.lints.rust]
unsafe_code = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
