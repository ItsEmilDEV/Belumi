[package]
name = "belumi-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Belumi core: configuration management, logging setup, and central integration"

[dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
toml = "1.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-log = "0.2"

# Error handling
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true