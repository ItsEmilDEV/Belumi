name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --check -p belumi-core -p belumi-protocol-compat -p belumi-plugin-api

      - name: Run clippy
        run: cargo clippy -p belumi-core -p belumi-protocol-compat -p belumi-plugin-api -- -D warnings

      - name: Run tests
        run: cargo test -p belumi-core -p belumi-protocol-compat -p belumi-plugin-api
  launcher-windows:
    name: Launcher on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-launcher-${{ hashFiles('**/Cargo.lock') }}

      - name: Build the launcher
        run: cargo build -p belumi-launcher

      - name: Test the launcher
        run: cargo test -p belumi-launcher
