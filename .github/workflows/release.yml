name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux archive
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev libudev-dev libopus-dev cmake pkg-config rpm curl

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the archive
        env:
          BELUMI_FEATURES: belumi
        run: packaging/build-release.sh "${GITHUB_REF_NAME#v}"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          notes=(--generate-notes)
          [ -f "docs/release-notes/${GITHUB_REF_NAME}.md" ] && notes=(--notes-file "docs/release-notes/${GITHUB_REF_NAME}.md")
          gh release create "$GITHUB_REF_NAME" $flags --title "Belumi ${GITHUB_REF_NAME#v}" "${notes[@]}" \
            dist/*.tar.gz dist/*.deb dist/*.rpm dist/*.AppImage dist/*.sha256

  windows:
    name: Windows zip and installer
    runs-on: windows-latest
    needs: linux
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Inno Setup for the installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build the zip and the installer
        shell: pwsh
        env:
          BELUMI_FEATURES: belumi
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          packaging/build-release.ps1 $version

      - name: Add to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" (Get-ChildItem dist -File | Where-Object { $_.Name -match '\.(zip|exe|sha256)$' }).FullName --clobber
