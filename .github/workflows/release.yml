name: Release

# A tag vX.Y.Z builds the Linux files and the Windows files side by side; the release is created only when both are ready,
# so there is never a release with half of its downloads. A tag with a "-" (v0.2.0-beta.1) becomes a prerelease.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux archive, deb, rpm and AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev libudev-dev libopus-dev cmake pkg-config rpm curl

      - uses: dtolnay/rust-toolchain@stable

      # Compiled dependencies come from the cache that cache-warmup.yml keeps on main (a tag run cannot share its own).
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-linux
          workspaces: |
            . -> target
            vendor/horizon -> target
          save-if: false

      - name: Build the archive and the packages
        env:
          BELUMI_FEATURES: belumi
        run: packaging/build-release.sh "${GITHUB_REF_NAME#v}"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.sha256
          if-no-files-found: error

  windows:
    name: Windows zip and installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows
          workspaces: |
            . -> target
            vendor/horizon -> target
          save-if: false

      - name: Inno Setup for the installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build the zip and the installer
        shell: pwsh
        env:
          BELUMI_FEATURES: belumi
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          packaging/build-release.ps1 $version

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Create the release
    runs-on: ubuntu-latest
    needs: [linux, windows]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          notes=(--generate-notes)
          [ -f "docs/release-notes/${GITHUB_REF_NAME}.md" ] && notes=(--notes-file "docs/release-notes/${GITHUB_REF_NAME}.md")
          gh release create "$GITHUB_REF_NAME" $flags --title "Belumi ${GITHUB_REF_NAME#v}" "${notes[@]}" dist/*
